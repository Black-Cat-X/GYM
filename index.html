<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
  <meta name="description" content="App personal de registro de entrenamiento">
  <title>Gym</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- asistente primera vez -->
  <div id="setup-root"></div>

  <!-- shell de la app -->
  <div id="app-shell">

    <!-- recordatorio de respaldo (oculto por defecto) -->
    <div id="respaldo-banner" hidden role="alert">
      <span id="respaldo-msg"></span>
      <div class="respaldo-acciones">
        <button id="respaldo-exportar" class="respaldo-btn-exportar">Exportar ahora</button>
        <button id="respaldo-cerrar" class="respaldo-btn-cerrar" aria-label="Cerrar">×</button>
      </div>
    </div>

    <!-- vistas -->
    <main>
      <section id="vista-rutina"    class="vista" hidden>
        <p class="vista-placeholder">Rutina — próxima fase</p>
      </section>
      <section id="vista-registrar" class="vista" hidden>
        <p class="vista-placeholder">Registrar — próxima fase</p>
      </section>
      <section id="vista-ejercicios" class="vista" hidden>
        <p class="vista-placeholder">Ejercicios — próxima fase</p>
      </section>
      <section id="vista-progreso"  class="vista" hidden>
        <p class="vista-placeholder">Progreso — próxima fase</p>
      </section>
      <section id="vista-config"    class="vista" hidden>
        <p class="vista-placeholder">Configuración — próxima fase</p>
      </section>
    </main>

    <!-- navegación inferior -->
    <nav class="nav-inferior" aria-label="Navegación principal">
      <button class="nav-btn" data-vista="rutina">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M9 16l2 2 4-4"/>
        </svg>
        Rutina
      </button>
      <button class="nav-btn" data-vista="registrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        Registrar
      </button>
      <button class="nav-btn" data-vista="ejercicios">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6.5 5v14M17.5 5v14M3.5 8.5h3M17.5 8.5h3M3.5 15.5h3M17.5 15.5h3"/><line x1="6.5" y1="12" x2="17.5" y2="12"/>
        </svg>
        Ejercicios
      </button>
      <button class="nav-btn" data-vista="progreso">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>
        </svg>
        Progreso
      </button>
      <button class="nav-btn" data-vista="config">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><line x1="9" y1="3" x2="9" y2="9"/><line x1="15" y1="9" x2="15" y2="15"/><line x1="12" y1="15" x2="12" y2="21"/>
        </svg>
        Config
      </button>
    </nav>

  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
